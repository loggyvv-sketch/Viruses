<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viral Entry | H2 Biology 9744</title>
    <style>
        :root {
            --bg: #020617;
            --membrane: #64748b;
            --hiv: #0ea5e9;
            --flu: #f43f5e;
            --gold: #fbbf24;
            --text: #f1f5f9;
        }

        * { touch-action: none; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header & Tabs --- */
        header {
            padding: 15px;
            text-align: center;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            z-index: 100;
        }

        .tab-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }

        .tab {
            padding: 10px 18px;
            border-radius: 12px;
            background: #1e293b;
            border: 2px solid transparent;
            color: #64748b;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.3s all;
        }

        .tab.active-hiv { border-color: var(--hiv); color: var(--hiv); background: rgba(14, 165, 233, 0.1); }
        .tab.active-flu { border-color: var(--flu); color: var(--flu); background: rgba(244, 63, 94, 0.1); }

        /* --- Simulation Stage --- */
        #stage {
            flex-grow: 1;
            position: relative;
            background: radial-gradient(circle at 50% 30%, #111827 0%, #020617 100%);
        }

        svg { width: 100%; height: 100%; pointer-events: none; }

        #touch-controller {
            position: absolute;
            width: 80px;
            height: 80px;
            left: calc(50% - 40px);
            top: 15%;
            z-index: 200;
            cursor: grab;
        }

        /* --- Info Card --- */
        .info-card {
            background: #0f172a;
            border-top: 1px solid #1e293b;
            padding: 20px;
            height: 180px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #title { color: #10b981; font-size: 1rem; margin: 0 0 5px 0; }
        #desc { font-size: 0.85rem; color: #94a3b8; line-height: 1.5; max-width: 600px; margin: 0 auto; }

        /* Terminology highlights */
        .term { color: var(--gold); font-weight: 600; }
    </style>
</head>
<body>

<header>
    <div style="font-size: 0.6rem; letter-spacing: 2px; color: #475569;">9744 H2 BIOLOGY SYLLABUS</div>
    <div class="tab-box">
        <div id="tab-hiv" class="tab" onclick="init('hiv')">HIV (FUSION)</div>
        <div id="tab-flu" class="tab" onclick="init('flu')">FLU (ENDOCYTOSIS)</div>
    </div>
</header>

<div id="stage">
    <div id="touch-controller"></div>
    <svg id="scene" viewBox="0 0 400 600">
        <!-- Main Cell Surface -->
        <path id="surface" d="M -50 400 L 450 400" stroke="var(--membrane)" stroke-width="6" fill="none" />
        
        <!-- Receptors -->
        <g id="receptors">
            <rect x="195" y="380" width="10" height="20" fill="var(--gold)" rx="2" />
            <rect id="hiv-co" x="220" y="385" width="6" height="15" fill="#f43f5e" rx="1" />
        </g>

        <!-- The Virus Particle -->
        <g id="virus-group">
            <!-- Endosomal Membrane (Only visible for Flu inside cell) -->
            <circle id="endosome-layer" r="45" fill="none" stroke="var(--membrane)" stroke-width="4" stroke-dasharray="4 4" opacity="0" />
            
            <!-- Viral Envelope -->
            <circle id="envelope" r="32" fill="rgba(255,255,255,0.05)" stroke-width="3" />
            
            <!-- Viral Contents -->
            <g id="payload">
                <path id="core-1" d="M -5 -10 L 5 -10 L 0 10 Z" fill="white" />
                <circle id="core-2" cx="10" cy="5" r="3" fill="white" />
                <circle id="core-3" cx="-12" cy="0" r="3" fill="white" />
            </g>
        </g>
    </svg>
</div>

<div class="info-card">
    <h2 id="title">Select a Virus</h2>
    <p id="desc">Drag the virus slowly to the membrane. Observe the molecular reconfiguration of the lipid bilayer.</p>
</div>

<script>
    const surface = document.getElementById('surface');
    const controller = document.getElementById('touch-controller');
    const virusGroup = document.getElementById('virus-group');
    const envelope = document.getElementById('envelope');
    const endoLayer = document.getElementById('endosome-layer');
    const payload = document.getElementById('payload');
    const hivCo = document.getElementById('hiv-co');
    
    let mode = '';
    let isBusy = false;
    let vPos = { x: 200, y: 150 };

    function init(m) {
        // RESET Logic (Requirement 1)
        mode = m;
        isBusy = false;
        vPos = { x: 200, y: 150 };
        
        // UI Reset
        document.querySelectorAll('.tab').forEach(t => t.className = 'tab');
        document.getElementById(`tab-${m}`).classList.add(`active-${m}`);
        
        // Simulation Reset
        controller.style.transition = "none";
        controller.style.top = '15%';
        controller.style.left = 'calc(50% - 40px)';
        
        surface.setAttribute('d', "M -50 400 L 450 400");
        surface.style.stroke = "var(--membrane)";
        
        envelope.style.opacity = '1';
        envelope.style.transform = 'scale(1)';
        envelope.setAttribute('stroke', m === 'hiv' ? 'var(--hiv)' : 'var(--flu)');
        
        endoLayer.style.opacity = '0';
        endoLayer.style.transform = 'scale(1)';
        
        payload.style.transition = 'none';
        payload.style.transform = 'translate(0,0)';
        payload.style.opacity = '1';
        
        hivCo.style.opacity = m === 'hiv' ? '1' : '0';
        
        updateGfx();
        
        document.getElementById('title').innerText = m === 'hiv' ? "HIV: CD4 Attachment" : "Flu: Sialic Acid Binding";
        document.getElementById('desc').innerText = "Drag the virus down to the yellow receptor site. Move slowly to see the ripple effect.";
    }

    // --- Interaction Engine ---
    controller.addEventListener('pointermove', (e) => {
        if (isBusy || e.buttons !== 1) return;

        const stage = document.getElementById('stage').getBoundingClientRect();
        vPos.x = e.clientX - stage.left;
        vPos.y = e.clientY - stage.top;

        controller.style.left = (vPos.x - 40) + 'px';
        controller.style.top = (vPos.y - 40) + 'px';

        updateGfx();
        animateRipple();

        // Proximity detection
        if (vPos.y > 365 && Math.abs(vPos.x - 200) < 40) {
            isBusy = true;
            mode === 'hiv' ? runHIV() : runFlu();
        }
    });

    function updateGfx() {
        virusGroup.setAttribute('transform', `translate(${vPos.x}, ${vPos.y})`);
    }

    function animateRipple() {
        const dist = 400 - vPos.y;
        if (dist > 0 && dist < 100) {
            const pull = (100 - dist) / 2;
            surface.setAttribute('d', `M -50 400 Q 200 ${400 + pull} 450 400`);
        } else if (dist <= 0) {
            surface.setAttribute('d', `M -50 400 Q 200 440 450 400`);
        }
    }

    // --- HIV FUSION MECHANISM ---
    function runHIV() {
        document.getElementById('desc').innerHTML = "gp120 binds to CD4. gp41 then mediates the <span class='term'>Fusion</span> of the viral envelope with the <span class='term'>cell surface membrane</span>.";
        
        // Smooth snap to membrane
        vPos.y = 370;
        updateGfx();
        
        setTimeout(() => {
            // Envelope dissolves into the ripple
            envelope.style.transition = "all 1.5s ease";
            envelope.style.transform = "scaleY(0) translateY(30px)";
            envelope.style.opacity = "0";
            
            // Surface membrane glows blue (taking in viral lipids)
            surface.style.transition = "stroke 1s";
            surface.style.stroke = "var(--hiv)";

            setTimeout(() => {
                document.getElementById('title').innerText = "Uncoating (HIV)";
                document.getElementById('desc').innerText = "The viral envelope is integrated into the host membrane. The capsid is released directly into the cytosol.";
                
                payload.style.transition = "all 3s cubic-bezier(0.1, 0.5, 0.5, 1)";
                payload.style.transform = "translate(40px, 150px) rotate(45deg)";
            }, 1000);
        }, 800);
    }

    // --- FLU ENDOCYTOSIS MECHANISM (Requirement 2) ---
    function runFlu() {
        document.getElementById('desc').innerHTML = "Binding triggers <span class='term'>receptor-mediated endocytosis</span>. The membrane invaginates to form a pocket.";

        // 1. Invagination
        let step = 0;
        const animateInvagination = setInterval(() => {
            step += 2;
            vPos.y = 370 + step;
            updateGfx();
            
            // Draw the "neck" narrowing
            const neck = Math.max(0, 40 - step/2);
            surface.setAttribute('d', `M -50 400 L ${200-neck} 400 Q 200 ${400 + step*2} ${200+neck} 400 L 450 400`);

            if (step >= 80) {
                clearInterval(animateInvagination);
                pinchOff();
            }
        }, 20);
    }

    function pinchOff() {
        document.getElementById('title').innerText = "Vesicle Scission";
        document.getElementById('desc').innerHTML = "The membrane <span class='term'>pinches off</span>. The virus is now enclosed in an <span class='term'>Endosome</span>.";

        // Scission Animation
        surface.setAttribute('d', "M -50 400 L 450 400"); // Surface resets
        
        // Show the double layer
        endoLayer.style.opacity = '1'; 
        
        setTimeout(() => {
            // Move endosome deeper
            vPos.y = 520;
            updateGfx();
            
            setTimeout(() => {
                document.getElementById('title').innerText = "Double-Membrane Fusion";
                document.getElementById('desc').innerHTML = "Inside the endosome, <span class='term'>Low pH</span> triggers HA to fuse the viral envelope with the <span class='term'>endosomal membrane</span>.";
                
                // Both membranes fuse and disappear
                endoLayer.style.transition = "all 1s";
                envelope.style.transition = "all 1s";
                endoLayer.style.transform = "scale(1.2)";
                envelope.style.transform = "scale(1.2)";
                endoLayer.style.opacity = "0";
                envelope.style.opacity = "0";

                setTimeout(() => {
                    document.getElementById('desc').innerText = "Fusion releases the 8 RNPs into the cytosol, allowing them to migrate to the nucleus.";
                    payload.style.transition = "all 4s cubic-bezier(0.1, 0.5, 0.5, 1)";
                    payload.style.transform = "translate(-60px, 40px) rotate(-90deg)";
                }, 800);
            }, 2000);
        }, 1000);
    }

    // Start
    init('hiv');
</script>

</body>
</html>
