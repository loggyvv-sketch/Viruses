<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fluid Entry | H2 Biology 9744</title>
    <style>
        :root {
            --bg: #020617;
            --membrane: #64748b;
            --hiv: #38bdf8;
            --flu: #fb7185;
            --gold: #fbbf24;
            --text: #f1f5f9;
        }

        * { touch-action: none; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- UI Controls --- */
        header {
            padding: 20px;
            text-align: center;
            background: linear-gradient(to bottom, #0f172a, transparent);
            z-index: 100;
        }

        .virus-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
        }

        .chip {
            padding: 10px 20px;
            border-radius: 25px;
            background: #1e293b;
            border: 2px solid transparent;
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.4s all cubic-bezier(0.4, 0, 0.2, 1);
        }

        .chip.active-hiv { border-color: var(--hiv); color: var(--hiv); box-shadow: 0 0 20px rgba(56, 189, 248, 0.3); }
        .chip.active-flu { border-color: var(--flu); color: var(--flu); box-shadow: 0 0 20px rgba(251, 113, 133, 0.3); }

        /* --- Simulation Canvas --- */
        #stage {
            flex-grow: 1;
            position: relative;
            background: radial-gradient(circle at 50% 40%, #0f172a 0%, #020617 100%);
        }

        svg { width: 100%; height: 100%; }

        #virus-touch-zone {
            position: absolute;
            width: 80px;
            height: 80px;
            left: calc(50% - 40px);
            top: 15%;
            z-index: 200;
            cursor: grab;
        }

        /* --- Text Panel --- */
        .info-card {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(15px);
            border-top: 1px solid #334155;
            padding: 20px;
            height: 180px;
            text-align: center;
        }

        h2 { margin: 0 0 8px 0; font-size: 1.1rem; color: #10b981; }
        p { margin: 0; font-size: 0.9rem; color: #94a3b8; line-height: 1.6; }

        /* Animations */
        .contents { transition: all 5s cubic-bezier(0.1, 0.5, 0.2, 1); }
    </style>
</head>
<body>

<header>
    <div style="font-size: 0.6rem; letter-spacing: 2px; color: #475569; margin-bottom: 5px;">BIOMEMBRANE DYNAMICS</div>
    <div class="virus-selector">
        <div id="tab-hiv" class="chip" onclick="init('hiv')">HIV (FUSION)</div>
        <div id="tab-flu" class="chip" onclick="init('flu')">FLU (ENDOCYTOSIS)</div>
    </div>
</header>

<div id="stage">
    <div id="virus-touch-zone"></div>
    <svg id="viewbox" viewBox="0 0 400 600">
        <!-- Membrane path will be dynamically generated by JS for ripple effect -->
        <path id="membrane-path" d="" stroke="var(--membrane)" stroke-width="6" fill="none" stroke-linecap="round" />
        
        <!-- Receptors -->
        <g id="receptor-group">
            <path d="M 195 400 L 195 380 Q 200 375 205 380 L 205 400" fill="var(--gold)" />
            <path id="co-receptor" d="M 220 400 L 220 385 Q 223 382 226 385 L 226 400" fill="#f43f5e" />
        </g>

        <!-- Virus Visuals -->
        <g id="virus-gfx">
            <circle id="v-envelope" r="35" fill="rgba(255,255,255,0.02)" stroke-width="3" />
            <g id="v-payload">
                <path class="contents" d="M -5 -10 L 5 -10 L 0 10 Z" fill="white" opacity="0.9" /> <!-- Capsid/RNP -->
                <circle class="contents" cx="10" cy="5" r="3" fill="white" opacity="0.6" />
                <circle class="contents" cx="-12" cy="0" r="2" fill="white" opacity="0.6" />
            </g>
        </g>
    </svg>
</div>

<div class="info-card">
    <h2 id="title">Select Mechanism</h2>
    <p id="desc">Grounded in 9744 Syllabus. Drag the virus slowly to the membrane to observe fluid interaction.</p>
</div>

<script>
    const membrane = document.getElementById('membrane-path');
    const touchZone = document.getElementById('virus-touch-zone');
    const virusGfx = document.getElementById('virus-gfx');
    const envelope = document.getElementById('v-envelope');
    const payload = document.querySelectorAll('.contents');
    
    let mode = '';
    let isTransitioning = false;
    let virusPos = { x: 200, y: 150 };

    // --- 1. MEMBRANE FLUIDITY ENGINE ---
    // Creates a ripple effect based on virus proximity
    function drawMembrane(rippleY = 0) {
        const baseY = 400;
        const dist = Math.abs(virusPos.x - 200);
        const influence = Math.max(0, 1 - (Math.abs(virusPos.y - baseY) / 200));
        
        // Dynamic ripple logic
        const rippleWidth = 80;
        const dip = rippleY * influence;

        const d = `
            M -50 ${baseY} 
            L ${100} ${baseY}
            Q ${200} ${baseY + (dip * 1.5)} ${300} ${baseY}
            L 450 ${baseY}
        `;
        membrane.setAttribute('d', d);
    }

    // --- 2. INITIALIZATION ---
    function init(m) {
        mode = m;
        isTransitioning = false;
        virusPos = { x: 200, y: 150 };
        
        document.querySelectorAll('.chip').forEach(c => c.className = 'chip');
        document.getElementById(`tab-${m}`).classList.add(`active-${m}`);

        touchZone.style.top = '15%';
        touchZone.style.left = 'calc(50% - 40px)';
        envelope.style.opacity = '1';
        envelope.setAttribute('stroke', m === 'hiv' ? 'var(--hiv)' : 'var(--flu)');
        document.getElementById('co-receptor').style.opacity = m === 'hiv' ? '1' : '0';
        
        payload.forEach(p => {
            p.style.transform = 'translate(0,0) rotate(0deg)';
            p.style.opacity = '0.9';
        });

        updateGfx();
        drawMembrane(0);

        document.getElementById('title').innerText = m === 'hiv' ? "HIV: Membrane Fusion" : "Flu: Endocytosis";
        document.getElementById('desc').innerText = "Drag the virus slowly. Notice the membrane ripple as proteins interact.";
    }

    // --- 3. INTERACTIVE DRAGGING ---
    touchZone.addEventListener('pointermove', (e) => {
        if (isTransitioning || e.buttons !== 1) return;

        const stage = document.getElementById('stage').getBoundingClientRect();
        virusPos.x = e.clientX - stage.left;
        virusPos.y = e.clientY - stage.top;

        touchZone.style.left = (virusPos.x - 40) + 'px';
        touchZone.style.top = (virusPos.y - 40) + 'px';

        updateGfx();
        
        // Create ripple effect as it nears
        const dy = 400 - virusPos.y;
        drawMembrane(dy < 100 ? (100 - dy) / 2 : 0);

        if (virusPos.y > 360 && Math.abs(virusPos.x - 200) < 40) {
            isTransitioning = true;
            executeEntry();
        }
    });

    function updateGfx() {
        virusGfx.setAttribute('transform', `translate(${virusPos.x}, ${virusPos.y})`);
    }

    // --- 4. FLUID ENTRY SEQUENCES ---
    function executeEntry() {
        if (mode === 'hiv') {
            animateHIVFusion();
        } else {
            animateFluEndocytosis();
        }
    }

    function animateHIVFusion() {
        document.getElementById('desc').innerText = "gp41 brings membranes together. The fusion pore opens and the viral envelope becomes PART of the cell membrane.";
        
        // Move slowly into contact
        let progress = 0;
        const interval = setInterval(() => {
            progress += 0.02;
            virusPos.y = 360 + (progress * 30);
            updateGfx();
            drawMembrane(20 + progress * 20);

            if (progress >= 1) {
                clearInterval(interval);
                finalizeHIV();
            }
        }, 20);
    }

    function finalizeHIV() {
        // The "Merge": The virus border disappears into the membrane ripple
        envelope.style.transition = "all 2s ease";
        envelope.style.transform = "scaleY(0) translateY(40px)";
        envelope.style.opacity = "0";
        
        membrane.style.stroke = "var(--hiv)";
        membrane.style.transition = "stroke 1s ease";

        setTimeout(() => {
            document.getElementById('title').innerText = "Fusion Complete";
            document.getElementById('desc').innerText = "The viral envelope has merged into the fluid host membrane. Contents spread into the cytoplasm.";
            releaseContents(100);
        }, 1000);
    }

    function animateFluEndocytosis() {
        document.getElementById('desc').innerText = "The membrane is fluid and flexible. It invaginates, curving around the virus to form an endosome.";

        let progress = 0;
        const interval = setInterval(() => {
            progress += 0.01;
            virusPos.y = 360 + (progress * 150);
            updateGfx();
            
            // Deepen the invagination path
            const dip = progress * 80;
            const wrap = progress * 50;
            const d = `
                M -50 400 
                L ${200 - wrap} 400 
                Q 200 ${400 + dip * 2} ${200 + wrap} 400 
                L 450 400
            `;
            membrane.setAttribute('d', d);

            if (progress >= 1) {
                clearInterval(interval);
                finalizeFlu();
            }
        }, 30);
    }

    function finalizeFlu() {
        // Snap membrane back
        membrane.setAttribute('d', "M -50 400 L 450 400");
        envelope.setAttribute('stroke-dasharray', '4 4'); // Endosome visual
        
        setTimeout(() => {
            document.getElementById('title').innerText = "Endosomal Release";
            document.getElementById('desc').innerText = "Inside the endosome, low pH triggers fusion. The RNPs are released and spread.";
            envelope.style.opacity = "0";
            releaseContents(60);
        }, 1500);
    }

    function releaseContents(yShift) {
        payload.forEach((p, i) => {
            const tx = (Math.random() - 0.5) * 250;
            const ty = yShift + (Math.random() * 150);
            const rot = Math.random() * 720;
            p.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg)`;
        });
    }

    // Initial Start
    init('hiv');
</script>

</body>
</html>
