<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viral Entry | 9744 H2 Bio</title>
    <style>
        :root {
            --bg: #030712;
            --membrane: #334155;
            --hiv: #0ea5e9;
            --flu: #f43f5e;
            --gold: #fbbf24;
            --text: #f8fafc;
        }

        * { touch-action: none; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- UI Overlay --- */
        header {
            padding: 20px;
            text-align: center;
            background: linear-gradient(to bottom, #0f172a, transparent);
            z-index: 100;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .tab {
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(30, 41, 59, 0.5);
            color: #94a3b8;
            cursor: pointer;
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            font-size: 0.8rem;
        }

        .tab.active-hiv { background: var(--hiv); color: white; box-shadow: 0 0 20px rgba(14, 165, 233, 0.4); }
        .tab.active-flu { background: var(--flu); color: white; box-shadow: 0 0 20px rgba(244, 63, 94, 0.4); }

        /* --- Simulation Stage --- */
        #stage {
            flex-grow: 1;
            position: relative;
            background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
        }

        svg { width: 100%; height: 100%; pointer-events: none; }

        #virus-hitbox {
            position: absolute;
            width: 80px;
            height: 80px;
            left: calc(50% - 40px);
            top: 15%;
            cursor: grab;
            z-index: 200;
            pointer-events: auto;
        }

        /* --- Information Card --- */
        .card {
            padding: 20px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.1);
            height: 160px;
            text-align: center;
            z-index: 100;
        }

        .card h2 { margin: 0 0 5px 0; font-size: 1.1rem; color: #10b981; }
        .card p { margin: 0; font-size: 0.9rem; color: #94a3b8; line-height: 1.5; }

        #hint {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--gold);
            opacity: 0.6;
        }

        /* --- Content Animation Classes --- */
        .particle { transition: all 4s cubic-bezier(0.1, 0.5, 0.5, 1); }
    </style>
</head>
<body>

<header>
    <div style="font-size: 0.6rem; letter-spacing: 3px; color: #64748b; margin-bottom: 5px;">MOLECULAR DYNAMICS</div>
    <div class="tabs">
        <div id="tab-hiv" class="tab" onclick="setup('hiv')">HIV FUSION</div>
        <div id="tab-flu" class="tab" onclick="setup('flu')">FLU ENDOCYTOSIS</div>
    </div>
</header>

<div id="stage">
    <div id="hint">GENTLY DRAG THE VIRUS TO THE SURFACE</div>
    <div id="virus-hitbox"></div>
    
    <svg viewBox="0 0 400 600">
        <!-- Receptors -->
        <g id="receptors">
            <path id="rec-main" d="M 195 400 L 195 380 Q 200 375 205 380 L 205 400" fill="var(--gold)" />
            <path id="rec-co" d="M 220 400 L 220 385 Q 223 382 226 385 L 226 400" fill="#f43f5e" />
        </g>

        <!-- Host Membrane (Morphable Path) -->
        <path id="membrane" d="M -50 400 Q 200 400 450 400" stroke="var(--membrane)" stroke-width="8" fill="none" stroke-linecap="round" />

        <!-- Virus Group -->
        <g id="virus-gfx">
            <circle id="v-env" cx="0" cy="0" r="35" fill="rgba(255,255,255,0.03)" stroke-width="3" />
            <g id="v-contents">
                <!-- HIV Capsid or Flu RNPs -->
                <rect id="c1" class="particle" x="-5" y="-15" width="10" height="20" rx="2" fill="white" opacity="0.8"/>
                <circle id="c2" class="particle" cx="8" cy="5" r="4" fill="white" opacity="0.6"/>
                <circle id="c3" class="particle" cx="-10" cy="8" r="3" fill="white" opacity="0.6"/>
            </g>
        </g>
    </svg>
</div>

<div class="card">
    <h2 id="title">Viral Entry</h2>
    <p id="desc">Choose a virus to begin the molecular visualization.</p>
</div>

<script>
    const hitbox = document.getElementById('virus-hitbox');
    const gfx = document.getElementById('virus-gfx');
    const env = document.getElementById('v-env');
    const membrane = document.getElementById('membrane');
    const title = document.getElementById('title');
    const desc = document.getElementById('desc');
    const contents = ['c1', 'c2', 'c3'].map(id => document.getElementById(id));

    let mode = '';
    let isLocked = false;

    // --- SETUP ---
    function setup(m) {
        mode = m;
        isLocked = false;
        document.querySelectorAll('.tab').forEach(t => t.className = 'tab');
        document.getElementById(`tab-${m}`).classList.add(`active-${m}`);

        // Reset positions
        hitbox.style.top = '15%';
        hitbox.style.left = 'calc(50% - 40px)';
        updateGfx();
        
        env.style.opacity = '1';
        env.style.strokeDasharray = '0';
        membrane.setAttribute('d', "M -50 400 Q 200 400 450 400");
        membrane.style.stroke = "var(--membrane)";
        
        contents.forEach(c => {
            c.style.transform = 'translate(0,0) rotate(0deg)';
            c.style.opacity = '0.8';
        });

        if(m === 'hiv') {
            env.setAttribute('stroke', 'var(--hiv)');
            document.getElementById('rec-co').style.opacity = '1';
            title.innerText = "HIV Attachment";
            desc.innerText = "gp120 binds to the CD4 receptor and a co-receptor on the Helper T-cell.";
        } else {
            env.setAttribute('stroke', 'var(--flu)');
            document.getElementById('rec-co').style.opacity = '0';
            title.innerText = "Influenza Attachment";
            desc.innerText = "Hemagglutinin binds to Sialic Acid receptors on the host epithelial cell.";
        }
    }

    // --- DRAG LOGIC ---
    hitbox.addEventListener('pointermove', (e) => {
        if(isLocked) return;
        if(e.buttons !== 1) return;

        const stage = document.getElementById('stage').getBoundingClientRect();
        let x = e.clientX - stage.left;
        let y = e.clientY - stage.top;

        hitbox.style.left = (x - 40) + 'px';
        hitbox.style.top = (y - 40) + 'px';
        updateGfx();

        // Contact Detection
        if(y > 360 && Math.abs(x - 200) < 50) {
            isLocked = true;
            triggerEntry(x, y);
        }
    });

    function updateGfx() {
        const x = hitbox.offsetLeft + 40;
        const y = hitbox.offsetTop + 40;
        gfx.setAttribute('transform', `translate(${x}, ${y})`);
    }

    // --- ENTRY MECHANISMS ---
    function triggerEntry(x, y) {
        if(mode === 'hiv') {
            animateHIV();
        } else {
            animateFlu();
        }
    }

    function animateHIV() {
        title.innerText = "Direct Fusion";
        desc.innerText = "gp41 facilitates the fusion of the viral envelope with the plasma membrane. They become one.";
        
        // Move virus perfectly to membrane
        hitbox.style.transition = "all 1s ease";
        hitbox.style.top = "365px";
        hitbox.style.left = "calc(50% - 40px)";
        setTimeout(updateGfx, 10);

        setTimeout(() => {
            // Morph: Envelope flattens and fades
            env.style.transition = "all 1.5s ease";
            env.style.transform = "scaleY(0.1) translateY(30px)";
            env.style.opacity = "0";
            membrane.style.stroke = "var(--hiv)";

            // Content Release
            releaseParticles(150);
        }, 1000);
    }

    function animateFlu() {
        title.innerText = "Invagination";
        desc.innerText = "The membrane curves to 'swallow' the virus. This forms the endosome.";

        // Morph membrane around virus
        membrane.style.transition = "all 1.5s cubic-bezier(0.4, 0, 0.2, 1)";
        membrane.setAttribute('d', "M -50 400 Q 200 400 160 400 A 40 40 0 1 0 240 400 Q 200 400 450 400");
        
        hitbox.style.transition = "all 1.5s cubic-bezier(0.4, 0, 0.2, 1)";
        hitbox.style.top = "400px";
        setTimeout(updateGfx, 10);

        setTimeout(() => {
            // Sink Endosome
            hitbox.style.top = "500px";
            membrane.setAttribute('d', "M -50 400 Q 200 400 450 400"); // Seal membrane
            env.style.strokeDasharray = "4 4"; // Show it's a vesicle
            setTimeout(updateGfx, 10);

            setTimeout(() => {
                title.innerText = "Endosomal Fusion";
                desc.innerText = "Low pH triggers HA to fuse the viral and endosomal membranes, releasing RNPs into the cytosol.";
                env.style.opacity = "0";
                releaseParticles(50);
            }, 1500);
        }, 1500);
    }

    function releaseParticles(yOffset) {
        contents.forEach((c, i) => {
            const driftX = (Math.random() - 0.5) * 200;
            const driftY = yOffset + (Math.random() * 100);
            const rot = Math.random() * 360;
            
            c.style.transition = `all ${3 + i}s cubic-bezier(0.1, 0.5, 0.5, 1)`;
            c.style.transform = `translate(${driftX}px, ${driftY}px) rotate(${rot}deg)`;
        });
        
        setTimeout(() => {
            title.innerText = "Uncoating Complete";
            desc.innerText = "The viral genetic material is now free in the cytoplasm to begin replication.";
        }, 2000);
    }

    // Start
    setup('hiv');
</script>

</body>
</html>
